  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      background: #FFF1E6;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #root { height: 100%; }
    @keyframes clayWobble {
      0%,100% { transform: translate(0,-1px) rotate(0deg); }
      25%     { transform: translate(-1px,-2px) rotate(-2deg); }
      75%     { transform: translate(1px,-2px) rotate(2deg); }
    }
    @keyframes confettiFly {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity:1; }
      100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.3); opacity:0; }
    }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes spin    { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes popIn   { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
    ::-webkit-scrollbar { display:none; }
    * { scrollbar-width:none; }
    input, button { font-family:inherit; }
  </style>

      {id:'s7',  name:'Sad Violin', emoji:'🎻', color:6,  category:'music', fav:false, dur:3.2, has_blob:false},

    ];

    const CATEGORIES = [
      {id:'all',  name:'All'},
      {id:'fav',  name:'Favorites'},
      {id:'meme', name:'Memes'},
      {id:'music',name:'Music'},
      {id:'reax', name:'Reactions'},
      {id:'retro',name:'Retro'},
    ];
    const BUILTIN_IDS = new Set(CATEGORIES.map(c => c.id));
    const titleCase = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

    // ─── Audio engine ────────────────────────────────────────────────────────────
    // For real recordings we use HTMLAudioElement — it routes through the iOS
    // *media* volume bus (more permissive than Web Audio) and survives the
    // silent switch in many cases. Web Audio is kept only for the synthetic
    // fallback used by seed sounds without a stored blob.
    window.__audioErrors = window.__audioErrors || [];
    function reportAudioError(label, err) {
      const msg = `${label}: ${err && err.message || err}`;
      console.error('audio error:', msg);
      window.__audioErrors.push({t: Date.now(), msg});
      window.dispatchEvent(new CustomEvent('audio-error', {detail: msg}));
    }

    class AudioEngine {
      constructor() {
        this._ctx = null; this._source = null;
        this._startTime = 0; this._duration = 0;
        this._onProgress = null; this._raf = null; this._onEnd = null;
        this._el = null; // shared HTMLAudioElement for blob playback
        this._buffers = {}; // decoded webaudio buffers (used for synthesis)
        this._urls = {}; // cached object URLs / remote URLs per id
        this._currentEl = null;
      }
      _getCtx() {
        if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this._ctx.state === 'suspended') this._ctx.resume();
        return this._ctx;
      }
      _getEl() {
        if (!this._el) {
          const a = new Audio();
          a.preload = 'auto';
          a.crossOrigin = 'anonymous';
          a.playsInline = true;
          this._el = a;
        }
        return this._el;
      }
      // Must be called inside a touchstart/click handler the first time.
      unlock() {
        if (this._unlocked) return;
        // Unlock Web Audio (silent buffer)
        try {
          const ctx = this._getCtx();
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch(_){}
        // Unlock HTMLAudioElement (load + play+pause inside gesture)
        try {
          const a = this._getEl();
          a.muted = true;
          const p = a.play();
          if (p && p.then) p.then(() => { a.pause(); a.muted = false; }).catch(()=>{ a.muted = false; });
          else { a.pause(); a.muted = false; }
        } catch(_){}
        this._unlocked = true;
      }
      registerURL(id, url) { this._urls[id] = url; }
      async loadURL(id, url) {
        // Probe duration via a separate audio element so the cached element
        // isn't disturbed. We don't need to decode for playback.
        this._urls[id] = url;
        return await new Promise((resolve) => {
          const probe = new Audio();
          probe.preload = 'metadata';
          probe.src = url;
          const done = () => resolve(isFinite(probe.duration) ? probe.duration : 1.5);
          probe.addEventListener('loadedmetadata', done, {once:true});
          probe.addEventListener('error', () => resolve(1.5), {once:true});
        });
      }
      _makeSynthetic(duration) {
        const ctx = this._getCtx();
        const sr  = ctx.sampleRate;
        const n   = Math.ceil(sr * duration);
        const buf = ctx.createBuffer(1, n, sr);
        const d   = buf.getChannelData(0);
        const f   = 180 + Math.random() * 200;
        for (let i = 0; i < n; i++) {
          const env = Math.min(1, i/(sr*0.015)) * Math.max(0, 1 - i/n);
          d[i] = Math.sin(2*Math.PI*f*i/sr) * env * 0.25;
        }
        return buf;
      }
      async play(id, duration, loop, onProgress, onEnd) {
        this.stop();
        const url = this._urls[id];
        if (url) {
          // HTMLAudioElement path
          const a = this._getEl();
          a.loop = !!loop;
          if (a.src !== url) a.src = url;
          a.currentTime = 0;
          this._currentEl = a;
          this._duration = duration; this._onProgress = onProgress;
          const onEndedHandler = () => {
            if (this._currentEl !== a) return;
            this._currentEl = null;
            cancelAnimationFrame(this._raf);
            this._onProgress && this._onProgress(0);
            onEnd && onEnd();
          };
          a.onended = loop ? null : onEndedHandler;
          try {
            await a.play();
          } catch(e) {
            reportAudioError('audio.play() rejected', e);
            this._currentEl = null;
            onEnd && onEnd();
            return;
          }
          // Progress tick
          const tick = () => {
            if (this._currentEl !== a) return;
            const dur = a.duration || duration || 1;
            const p = loop ? ((a.currentTime % dur) / dur) : Math.min(a.currentTime / dur, 1);
            this._onProgress && this._onProgress(p);
            if (p < 1 || loop) this._raf = requestAnimationFrame(tick);
          };
          this._raf = requestAnimationFrame(tick);
          return;
        }
        // Synthetic Web Audio path (seed sounds with no blob)
        try {
          const ctx = this._getCtx();
          if (ctx.state === 'suspended') { try { await ctx.resume(); } catch(_){} }
          const buf = this._buffers[id] || this._makeSynthetic(duration);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.loop   = loop;
          src.connect(ctx.destination);
          src.start(0);
          if (!loop) src.onended = () => { this._source = null; onEnd && onEnd(); };
          this._source = src; this._startTime = ctx.currentTime;
          this._duration = buf.duration; this._onProgress = onProgress;
          this._tick();
        } catch(e) {
          reportAudioError('webaudio play failed', e);
          onEnd && onEnd();
        }
      }
      _tick() {
        if (!this._source) return;
        const elapsed = this._getCtx().currentTime - this._startTime;
        const dur = this._duration;
        const p   = this._source.loop ? (elapsed % dur) / dur : Math.min(elapsed / dur, 1);
        this._onProgress && this._onProgress(p);
        if (p < 1 || this._source?.loop) this._raf = requestAnimationFrame(() => this._tick());
      }
      stop() {
        if (this._source) { try { this._source.stop(); } catch(_){} this._source = null; }
        if (this._currentEl) { try { this._currentEl.pause(); } catch(_){} this._currentEl = null; }
        if (this._raf)    { cancelAnimationFrame(this._raf); this._raf = null; }
        this._onProgress && this._onProgress(0);
      }
    }
    const engine = new AudioEngine();

    // Unlock audio on the very first touch/click anywhere — required for iOS Safari.
    (function installAudioUnlock() {
      const unlock = () => {
        engine.unlock();
        window.removeEventListener('touchstart', unlock, true);
        window.removeEventListener('touchend',   unlock, true);
        window.removeEventListener('mousedown',  unlock, true);
        window.removeEventListener('click',      unlock, true);
      };
      window.addEventListener('touchstart', unlock, {capture:true, passive:true});
      window.addEventListener('touchend',   unlock, {capture:true, passive:true});
      window.addEventListener('mousedown',  unlock, true);
      window.addEventListener('click',      unlock, true);
    })();

    // Encode an AudioBuffer as a 16-bit PCM WAV blob (universally decodable).
    function audioBufferToWav(buffer) {
      const numCh = buffer.numberOfChannels;
      const sr = buffer.sampleRate;
      const len = buffer.length;
      const interleaved = new Float32Array(len * numCh);
      for (let ch = 0; ch < numCh; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i = 0; i < len; i++) interleaved[i * numCh + ch] = data[i];
      }
      const dataLen = interleaved.length * 2;
      const ab = new ArrayBuffer(44 + dataLen);
      const view = new DataView(ab);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataLen, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * numCh * 2, true);
      view.setUint16(32, numCh * 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataLen, true);
      let off = 44;
      for (let i = 0; i < interleaved.length; i++) {
        const s = Math.max(-1, Math.min(1, interleaved[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
      return new Blob([ab], {type: 'audio/wav'});
    }

    // ─── Audio cache + loader ───────────────────────────────────────────────────
    const audioLoaded = {};
    async function ensureAudio(sound) {
      if (!sound.has_blob || audioLoaded[sound.id]) return;
      audioLoaded[sound.id] = true;
      const url = `${SUPABASE_URL}/storage/v1/object/public/audio/${sound.id}`;
      await engine.loadURL(sound.id, url);
    }

    // ─── useSoundboard ──────────────────────────────────────────────────────────
    function useSoundboard() {
      const [sounds,     setSounds]     = React.useState([]);
      const [playingId,  setPlayingId]  = React.useState(null);
      const [loadingId,  setLoadingId]  = React.useState(null);
      const [progress,   setProgress]   = React.useState(0);
      const [loop,       setLoop]       = React.useState(false);
      const [category,   setCategory]   = React.useState('all');
      const [addOpen,    setAddOpen]    = React.useState(false);
      const [appLoading, setAppLoading] = React.useState(true);
      const [syncDot,    setSyncDot]    = React.useState(false);
      const [editMode,   setEditMode]   = React.useState(false);
      const [customCategories, setCustomCategories] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('sb_customCategories') || '[]'); }
        catch(_) { return []; }
      });
      React.useEffect(() => {
        try { localStorage.setItem('sb_customCategories', JSON.stringify(customCategories)); } catch(_){}
      }, [customCategories]);
      const loopRef    = React.useRef(loop);
      loopRef.current  = loop;

      React.useEffect(() => {
        let cancelled = false;
        async function init() {
          const { data, error } = await db.from('sounds').select('*').order('created_at', {ascending:true});
          if (cancelled) return;
          if (error) { console.error('load sounds failed:', JSON.stringify(error)); setAppLoading(false); return; }
          const list = data || [];
          setSounds(list);
          setAppLoading(false);
          list.filter(s => s.has_blob).forEach(s => ensureAudio(s).catch(()=>{}));
        }
        init();

        const channel = db.channel('sounds-live')
          .on('postgres_changes', {event:'*', schema:'public', table:'sounds'}, payload => {
            if (cancelled) return;
            setSyncDot(true);
            setTimeout(() => setSyncDot(false), 1200);
            if (payload.eventType === 'INSERT') {
              setSounds(ss => ss.find(s => s.id === payload.new.id) ? ss : [...ss, payload.new]);
              if (payload.new.has_blob) ensureAudio(payload.new).catch(()=>{});
            } else if (payload.eventType === 'UPDATE') {
              setSounds(ss => ss.map(s => s.id === payload.new.id ? payload.new : s));
            } else if (payload.eventType === 'DELETE') {
              setSounds(ss => ss.filter(s => s.id !== payload.old.id));
            }
          })
          .subscribe();

        return () => { cancelled = true; db.removeChannel(channel); };
      }, []);

      const allCategories = React.useMemo(() => {
        const out = [...CATEGORIES];
        const seen = new Set(out.map(c => c.id));
        customCategories.forEach(c => {
          if (!seen.has(c.id)) { out.push(c); seen.add(c.id); }
        });
        sounds.forEach(s => {
          if (s.category && !seen.has(s.category)) {
            out.push({id: s.category, name: titleCase(s.category)});
            seen.add(s.category);
          }
        });
        return out;
      }, [sounds, customCategories]);

      const addCategory = React.useCallback((cat) => {
        if (!cat || !cat.id) return;
        if (BUILTIN_IDS.has(cat.id)) return;
        setCustomCategories(cs => cs.find(c => c.id === cat.id) ? cs : [...cs, cat]);
      }, []);

      const updateSoundCategory = React.useCallback(async (id, newCat) => {
        setSounds(ss => ss.map(s => s.id === id ? {...s, category: newCat} : s));
        await db.from('sounds').update({category: newCat}).eq('id', id);
      }, []);

      const [editingSound, setEditingSound] = React.useState(null);
      const updateSound = React.useCallback(async (id, patch) => {
        // Only allow safe metadata fields
        const safe = {};
        ['name','emoji','color','category','fav'].forEach(k => {
          if (patch[k] !== undefined) safe[k] = patch[k];
        });
        setSounds(ss => ss.map(s => s.id === id ? {...s, ...safe} : s));
        const {error} = await db.from('sounds').update(safe).eq('id', id);
        if (error) {
          console.error('update sound failed:', JSON.stringify(error));
          alert('Save failed: ' + (error.message || 'unknown error'));
          return false;
        }
        return true;
      }, []);

      const filtered = React.useMemo(() => {
        if (category === 'all') return sounds;
        if (category === 'fav') return sounds.filter(s => s.fav);
        return sounds.filter(s => s.category === category);
      }, [sounds, category]);

      const stop = React.useCallback(() => {
        engine.stop(); setPlayingId(null); setProgress(0);
      }, []);

      const [refreshing, setRefreshing] = React.useState(false);
      const refresh = React.useCallback(async () => {
        setRefreshing(true);
        try {
          const { data, error } = await db.from('sounds').select('*').order('created_at', {ascending:true});
          if (!error) {
            setSounds(data || []);
            (data || []).filter(s => s.has_blob).forEach(s => ensureAudio(s).catch(()=>{}));
            setSyncDot(true);
            setTimeout(() => setSyncDot(false), 1200);
          }
        } finally {
          setRefreshing(false);
        }
      }, []);

      const play = React.useCallback(async (id) => {
        engine.unlock(); // must happen before any await (iOS Safari)
        const sound = sounds.find(s => s.id === id);
        if (!sound || loadingId) return;
        engine.stop(); setPlayingId(null); setProgress(0);
        if (sound.has_blob && !audioLoaded[id]) {
          setLoadingId(id);
          try { await ensureAudio(sound); }
          catch(e) { setLoadingId(null); return; }
          setLoadingId(null);
        }
        setPlayingId(id);
        engine.play(id, sound.dur, loopRef.current,
          p => setProgress(p),
          () => { setPlayingId(null); setProgress(0); }
        );
      }, [sounds, loadingId]);

      const toggleFav = React.useCallback(async (id) => {
        const s = sounds.find(s => s.id === id);
        if (!s) return;
        const fav = !s.fav;
        setSounds(ss => ss.map(s => s.id === id ? {...s, fav} : s));
        await db.from('sounds').update({fav}).eq('id', id);
      }, [sounds]);

      const addSound = React.useCallback(async (partial) => {
        const id = 'u' + Date.now();
        let dur = 1.5, has_blob = false;
        if (partial.blob) {
          // Transcode to WAV so any device (including iOS Safari) can decode the file.
          let uploadBlob = partial.blob;
          let contentType = partial.blob.type || 'application/octet-stream';
          try {
            const ab = await partial.blob.arrayBuffer();
            const ctx = engine._getCtx();
            const decoded = await ctx.decodeAudioData(ab.slice(0));
            uploadBlob = audioBufferToWav(decoded);
            contentType = 'audio/wav';
            engine._buffers[id] = decoded;
            dur = decoded.duration;
            audioLoaded[id] = true;
          } catch(e) {
            console.warn('transcode failed, uploading original:', e && e.message);
          }
          const {error: upErr} = await db.storage.from('audio')
            .upload(id, uploadBlob, {contentType, upsert: false});
          if (upErr) {
            console.error('upload failed:', JSON.stringify(upErr));
            alert('Upload failed: ' + (upErr.message || 'unknown error'));
            return null;
          }
          has_blob = true;
          // Always register the public URL so the HTMLAudioElement playback path works
          engine.registerURL(id, `${SUPABASE_URL}/storage/v1/object/public/audio/${id}`);
          if (!audioLoaded[id]) {
            const url = `${SUPABASE_URL}/storage/v1/object/public/audio/${id}`;
            dur = await engine.loadURL(id, url).catch(() => 1.5);
            audioLoaded[id] = true;
          }
        }
        const newSound = {
          id, name: partial.name || 'New sound',
          emoji: partial.emoji || '🔊',
          color: partial.color ?? 0,
          category: partial.category || 'meme',
          fav: false, dur, has_blob,
        };
        const {data, error: insErr} = await db.from('sounds').insert(newSound).select().single();
        if (insErr) {
          console.error('insert sound failed:', JSON.stringify(insErr));
          alert('Save failed: ' + (insErr.message || 'unknown error'));
          return null;
        }
        if (data) setSounds(ss => ss.find(s => s.id === data.id) ? ss : [...ss, data]);
        return id;
      }, []);

      const deleteSound = React.useCallback(async (id) => {
        if (playingId === id) stop();
        const s = sounds.find(s => s.id === id);
        if (s?.has_blob) await db.storage.from('audio').remove([id]).catch(()=>{});
        await db.from('sounds').delete().eq('id', id);
        setSounds(ss => ss.filter(s => s.id !== id));
      }, [playingId, sounds, stop]);

      // Restart playback when loop toggles mid-play
      const prevLoop = React.useRef(loop);
      React.useEffect(() => {
        if (prevLoop.current !== loop && playingId) {
          const id = playingId; stop(); setTimeout(() => play(id), 0);
        }
        prevLoop.current = loop;
      }, [loop]);

      return {
        sounds, filtered, playingId, loadingId, progress,
        loop, setLoop, category, setCategory,
        addOpen, setAddOpen, play, stop, toggleFav, addSound, deleteSound,
        appLoading, syncDot, refresh, refreshing,

        editingSound, setEditingSound, updateSound,
      };
    }

    // ─── SoundRow ───────────────────────────────────────────────────────────────
    const formatDur = (d) => `0:${String(Math.max(0, Math.round(d || 0))).padStart(2,'0')}`;

    function SoundRow({sound, active, loading, progress, editMode, categories, onTap, onToggleFav, onDelete, onMove, onShare, onEdit}) {
      const [pressed,    setPressed]    = React.useState(false);
      const [confetti,   setConfetti]   = React.useState([]);
      const [showMenu,   setShowMenu]   = React.useState(false);
      const [showMove,   setShowMove]   = React.useState(false);
      const [confirmDel, setConfirmDel] = React.useState(false);
      const longTimer  = React.useRef(null);
      const confirmTmr = React.useRef(null);

      React.useEffect(() => () => {
        clearTimeout(longTimer.current);
        clearTimeout(confirmTmr.current);
      }, []);
      React.useEffect(() => {
        if (!editMode) { setConfirmDel(false); clearTimeout(confirmTmr.current); }
      }, [editMode]);

      const triggerConfetti = () => {
        const bits = Array.from({length:8}).map((_,i) => ({
          id: Math.random(),
          dx: (Math.random()-0.5)*50,
          dy: -Math.random()*40-10,
          rot: (Math.random()-0.5)*360,
          color: padColor((sound.color+i)%12),
        }));
        setConfetti(bits);
        setTimeout(() => setConfetti([]), 800);
      };

      const onStart = () => {
        setPressed(true);
        if (!editMode) longTimer.current = setTimeout(() => setShowMenu(true), 500);
      };
      const onEnd = () => {
        setPressed(false);
        clearTimeout(longTimer.current);
        if (editMode) { onEdit && onEdit(); return; } // tap in edit mode = open edit details
        if (!showMenu) { triggerConfetti(); onTap(); }
      };
      const onLeave = () => { setPressed(false); clearTimeout(longTimer.current); };

      const handleDeleteTap = (e) => {
        e.stopPropagation(); e.preventDefault();
        if (!confirmDel) {
          setConfirmDel(true);
          clearTimeout(confirmTmr.current);
          confirmTmr.current = setTimeout(() => setConfirmDel(false), 2500);
        } else {
          clearTimeout(confirmTmr.current);
          setConfirmDel(false);
          onDelete();
        }
      };

      const fill = padColor(sound.color, 0.66, 0.19);
      const deep = padColorDeep(sound.color, 0.42, 0.14);
      const catName = (categories || []).find(c => c.id === sound.category)?.name || '';
      const moveTargets = (categories || []).filter(c => c.id !== 'all' && c.id !== 'fav' && c.id !== sound.category);

      return (
        <div style={{ position:'relative' }}>
          {(showMenu || showMove) && (
            <div onClick={e=>{e.stopPropagation();setShowMenu(false);setShowMove(false);}}
              style={{position:'fixed',inset:0,zIndex:50}} />
          )}
          {showMenu && !showMove && (
            <div style={{
              position:'absolute', top:'50%', left:'50%',
              transform:'translate(-50%,-50%)',
              zIndex:51, background:'#2A1F3D', borderRadius:16,
              overflow:'hidden', minWidth:160,
              animation:'popIn .18s ease',
            }}>
              <button onClick={(e)=>{e.stopPropagation();onToggleFav();setShowMenu(false);}} style={{
                display:'block',width:'100%',padding:'13px 18px',
                fontSize:14,fontWeight:700,textAlign:'left',
                background:'none',border:'none',color:'#FFF1E6',cursor:'pointer',
                borderBottom:'1px solid rgba(255,241,230,0.15)',
              }}>{sound.fav ? '☆ Unfavorite' : '★ Favorite'}</button>
              <button onClick={(e)=>{e.stopPropagation();onEdit&&onEdit();setShowMenu(false);}} style={{
                display:'block',width:'100%',padding:'13px 18px',
                fontSize:14,fontWeight:700,textAlign:'left',
                background:'none',border:'none',color:'#FFF1E6',cursor:'pointer',
                borderBottom:'1px solid rgba(255,241,230,0.15)',
              }}>✏️ Edit details</button>
              <button onClick={(e)=>{e.stopPropagation();onShare&&onShare();setShowMenu(false);}} style={{
                display:'block',width:'100%',padding:'13px 18px',
                fontSize:14,fontWeight:700,textAlign:'left',
                background:'none',border:'none',color:'#FFF1E6',cursor:'pointer',
                borderBottom:'1px solid rgba(255,241,230,0.15)',
              }}>🔗 Share link</button>
              <button onClick={(e)=>{e.stopPropagation();setShowMove(true);}} style={{
                display:'block',width:'100%',padding:'13px 18px',
                fontSize:14,fontWeight:700,textAlign:'left',
                background:'none',border:'none',color:'#FFF1E6',cursor:'pointer',
                borderBottom:'1px solid rgba(255,241,230,0.15)',
              }}>📂 Move to…</button>
              <button onClick={(e)=>{e.stopPropagation();onDelete();setShowMenu(false);}} style={{
                display:'block',width:'100%',padding:'13px 18px',
                fontSize:14,fontWeight:700,textAlign:'left',
                background:'none',border:'none',
                color:'oklch(0.75 0.22 25)',cursor:'pointer',
              }}>🗑 Delete</button>
            </div>
          )}
          {showMove && (
            <div style={{
              position:'absolute', top:'50%', left:'50%',
              transform:'translate(-50%,-50%)',
              zIndex:52, background:'#2A1F3D', borderRadius:16,
              overflow:'hidden', minWidth:180, maxHeight:240, overflowY:'auto',
              animation:'popIn .18s ease',
            }}>
              <div style={{padding:'10px 16px',fontSize:11,fontWeight:700,color:'#FFF1E6',opacity:0.6,letterSpacing:1.2,textTransform:'uppercase',borderBottom:'1px solid rgba(255,241,230,0.15)'}}>
                Move to
              </div>
              {moveTargets.length === 0 ? (
                <div style={{padding:'13px 18px',fontSize:13,color:'#FFF1E6',opacity:0.6}}>No other categories</div>
              ) : moveTargets.map(c => (
                <button key={c.id} onClick={(e)=>{e.stopPropagation();onMove&&onMove(c.id);setShowMove(false);setShowMenu(false);}} style={{
                  display:'block',width:'100%',padding:'12px 18px',
                  fontSize:14,fontWeight:700,textAlign:'left',
                  background:'none',border:'none',color:'#FFF1E6',cursor:'pointer',
                  borderBottom:'1px solid rgba(255,241,230,0.1)',
                }}>{c.name}</button>
              ))}
            </div>
          )}

          <div
            onMouseDown={onStart} onMouseUp={onEnd} onMouseLeave={onLeave}
            onTouchStart={e=>{e.preventDefault();onStart();}}
            onTouchEnd={e=>{e.preventDefault();onEnd();}}
            onTouchCancel={onLeave}
            style={{
              display:'flex', alignItems:'center', gap:12,
              padding:'8px 6px', borderRadius:16,
              background: active ? padColorAlpha(sound.color, 0.12) : (pressed ? 'rgba(42,31,61,0.05)' : 'transparent'),
              cursor:'pointer', userSelect:'none', WebkitUserSelect:'none',
              transition:'background .15s',
            }}
          >
            <div style={{
              position:'relative', width:52, height:52, borderRadius:15, flexShrink:0,
              background: fill,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:24, lineHeight:1,
              transform: pressed ? 'scale(0.94)' : 'scale(1)',
              transition:'transform .1s cubic-bezier(.2,.8,.3,1.2)',
              opacity: loading ? 0.7 : 1,
            }}>
              {loading
                ? <div style={{width:22,height:22,borderRadius:'50%',border:'2.5px solid #FFF6EF',borderTopColor:'transparent',animation:'spin 0.7s linear infinite'}} />
                : sound.emoji}
              {confetti.map(b => (
                <div key={b.id} style={{
                  position:'absolute', top:'50%', left:'50%',
                  width:6, height:6, borderRadius:2,
                  background:b.color,
                  pointerEvents:'none',
                  '--dx':`${b.dx}px`,'--dy':`${b.dy}px`,'--rot':`${b.rot}deg`,
                  animation:'confettiFly 0.7s ease-out forwards',
                }} />
              ))}
            </div>

            <div style={{flex:1, minWidth:0}}>
              <div style={{
                fontSize:14, fontWeight:600, letterSpacing:-0.1,
                color: active ? deep : '#2A1F3D',
                whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
              }}>{sound.name}</div>
              <div style={{
                fontSize:11.5, marginTop:2,
                color: active ? deep : '#9C8FAE',
                whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
              }}>{catName}{sound.dur ? ` · ${formatDur(sound.dur)}` : ''}{active ? ' · playing' : ''}</div>
              {active && (
                <div style={{height:3,marginTop:5,borderRadius:2,background:'rgba(42,31,61,0.1)',overflow:'hidden',maxWidth:200}}>
                  <div style={{height:'100%',width:`${progress*100}%`,background:fill,transition:'width .05s linear',borderRadius:2}} />
                </div>
              )}
            </div>

            {editMode ? (
              <button
                onMouseDown={e=>e.stopPropagation()}
                onTouchStart={e=>{e.stopPropagation();}}
                onTouchEnd={handleDeleteTap}
                onClick={handleDeleteTap}
                aria-label={confirmDel ? 'Confirm delete' : 'Delete'}
                style={{
                  flexShrink:0,
                  minWidth: confirmDel ? 64 : 34, height:34,
                  padding: confirmDel ? '0 10px' : 0,
                  borderRadius: confirmDel ? 17 : '50%',
                  background:'oklch(0.62 0.22 25)', color:'#fff',
                  border:'none',
                  fontSize: confirmDel ? 11 : 15, fontWeight:700,
                  cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
                  letterSpacing: confirmDel ? 0.5 : 0,
                  textTransform:'uppercase',
                }}>
                {confirmDel ? 'Sure?' : '✕'}
              </button>
            ) : (
              <div style={{display:'flex', alignItems:'center', gap:2, flexShrink:0}}>
                {active ? (
                  <div aria-hidden="true" style={{width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center',color:fill,fontSize:13}}>▶</div>
                ) : (
                  <button
                    onMouseDown={e=>e.stopPropagation()}
                    onTouchStart={e=>{e.stopPropagation();}}
                    onTouchEnd={e=>{e.stopPropagation();e.preventDefault();onToggleFav();}}
                    onClick={e=>{e.stopPropagation();e.preventDefault();onToggleFav();}}
                    aria-label={sound.fav ? 'Unfavorite' : 'Favorite'}
                    style={{
                      width:30,height:30,borderRadius:'50%',border:'none',background:'none',
                      color: sound.fav ? fill : '#9C8FAE',
                      fontSize:16, cursor:'pointer',
                      display:'flex',alignItems:'center',justifyContent:'center',
                    }}>{sound.fav ? '★' : '☆'}</button>
                )}
                <button
                  onMouseDown={e=>e.stopPropagation()}
                  onTouchStart={e=>{e.stopPropagation();e.preventDefault();setShowMenu(true);}}
                  onClick={e=>{e.stopPropagation();e.preventDefault();setShowMenu(true);}}
                  aria-label="Options"
                  style={{
                    width:30,height:30,borderRadius:'50%',border:'none',background:'none',
                    color:'#9C8FAE', fontSize:18, fontWeight:700, lineHeight:1,
                    cursor:'pointer', display:'flex',alignItems:'center',justifyContent:'center',
                  }}>⋯</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── AddSoundModal ──────────────────────────────────────────────────────────
    const EMOJI_GROUPS = {
      'Faces': ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','😉','😍','🥰','😘','😎','🤩','🥳','😏','😒','😞','😔','😕','🙁','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😱','😨','😰','🤔','🤨','😐','😑','😬','🙄','😴','🤤','🥱','🤡','👻','💀'],
      'Reactions': ['👏','🙌','🤝','👍','👎','👌','✌️','🤟','🤘','🙏','👋','🤙','💪','🫡','🎉','🎊','🔥','💯','⭐','🌟','✨','💥','💢','💫','❌','✅','⚠️','🚨','❤️','💔','💖','😈','🤖'],
      'Music': ['🎵','🎶','🎼','🎤','🎧','🎷','🎸','🎺','🎻','🥁','🪘','🪗','📯','🎹','🪇','📻','🔊','🔇','📢','📣','📀','💿'],
      'Animals': ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐔','🐧','🐦','🦅','🦉','🐺','🐗','🐴','🦄','🐝','🦋','🐌','🐞','🐢','🐍','🦖','🐙','🦀','🐠','🐬','🐳','🦈'],
      'Food': ['🍎','🍌','🍇','🍉','🍓','🥭','🍍','🥑','🌶️','🍕','🍔','🍟','🌭','🥪','🌮','🌯','🍿','🍩','🍪','🍰','🎂','🍫','🍬','🍭','🍦','☕','🍵','🍺','🍻','🥂','🍷','🍸','🥤'],
      'Activity': ['⚽','🏀','🏈','⚾','🎾','🏐','🎱','🏓','🥊','🏆','🥇','🥈','🥉','🎯','🎳','🎮','🕹️','🎲','🎭','🎨','🎬','🚀','💼','🏁'],
      'Objects': ['💎','🔔','⚡','💡','🔦','📞','📱','💻','⌚','🎁','🎈','📺','📷','🎥','⏰','🛎️','💣','🧨','🪅','💩','💨','🩸','🦴'],
      'Symbols': ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💯','♻️','☮️','☯️','✝️','☪️','🕉️','🔯','✡️','☢️','☣️','🆗','🆒','🆕','🆙','♠️','♥️','♦️','♣️'],
    };
    const EMOJI_GROUP_NAMES = Object.keys(EMOJI_GROUPS);

    function AddSoundModal({open, onClose, onAdd, categories, onAddCategory, editing, onUpdate}) {
      const isEdit = !!editing;
      const [name,       setName]       = React.useState('');
      const [emoji,      setEmoji]      = React.useState('🔊');
      const [color,      setColor]      = React.useState(0);
      const [category,   setCategory]   = React.useState('meme');
      const [file,       setFile]       = React.useState(null);
      const [recording,  setRecording]  = React.useState(false);
      const [recTime,    setRecTime]    = React.useState(0);
      const [recBlob,    setRecBlob]    = React.useState(null);
      const [uploading,  setUploading]  = React.useState(false);
      const [emojiTab,   setEmojiTab]   = React.useState('Faces');
      const [previewing, setPreviewing] = React.useState(false);
      const [newCatOpen, setNewCatOpen] = React.useState(false);
      const [newCatName, setNewCatName] = React.useState('');
      const [micError,   setMicError]   = React.useState(null);
      const mediaRef    = React.useRef(null);
      const chunksRef   = React.useRef([]);
      const rafRef      = React.useRef(null);
      const startRef    = React.useRef(0);
      const previewRef  = React.useRef(null);
      const previewURL  = React.useRef(null);

      const cleanupPreview = () => {
        if (previewRef.current) { try { previewRef.current.pause(); } catch(_){} previewRef.current = null; }
        if (previewURL.current) { try { URL.revokeObjectURL(previewURL.current); } catch(_){} previewURL.current = null; }
        setPreviewing(false);
      };
      const cleanupMic = () => {
        if (mediaRef.current) {
          try { mediaRef.current.stream && mediaRef.current.stream.getTracks().forEach(t=>t.stop()); } catch(_){}
          try { mediaRef.current.stop(); } catch(_){}
          mediaRef.current = null;
        }
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        setRecording(false);
      };

      React.useEffect(() => {
        if (!open) {
          setName(''); setEmoji('🔊'); setColor(0); setCategory('meme');
          setFile(null); setRecTime(0); setRecBlob(null); setUploading(false);
          setEmojiTab('Faces'); setNewCatOpen(false); setNewCatName('');
          setMicError(null);
          cleanupMic();
          cleanupPreview();
        } else if (editing) {
          // Prefill when opening in edit mode
          setName(editing.name || '');
          setEmoji(editing.emoji || '🔊');
          setColor(typeof editing.color === 'number' ? editing.color : 0);
          setCategory(editing.category || 'meme');
          setFile(null); setRecTime(0); setRecBlob(null); setUploading(false);
          setMicError(null);
          // Try to land on the emoji's tab
          const tab = EMOJI_GROUP_NAMES.find(g => EMOJI_GROUPS[g].includes(editing.emoji));
          setEmojiTab(tab || 'Faces');
          setNewCatOpen(false); setNewCatName('');
        }
      }, [open, editing]);

      // Pick a MediaRecorder MIME type the current browser actually supports.
      // iOS Safari supports audio/mp4 (not audio/webm); Chrome/FF prefer webm/opus.
      const pickRecMime = () => {
        if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
        const candidates = [
          'audio/webm;codecs=opus', 'audio/webm',
          'audio/mp4;codecs=mp4a.40.2', 'audio/mp4',
          'audio/aac', 'audio/ogg;codecs=opus',
        ];
        for (const t of candidates) { if (MediaRecorder.isTypeSupported(t)) return t; }
        return '';
      };

      const startRec = async () => {
        setMicError(null);
        cleanupPreview();
        // Pre-flight: must be a secure context with a working mediaDevices API
        if (!window.isSecureContext) {
          setMicError({title:'Insecure connection', body:'Microphone needs HTTPS. Open the site at https:// and try again.'});
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setMicError({title:'Mic not available', body:'Your browser blocked the microphone API. On iPhone, try regular Safari (not Private Browsing or in-app browsers like Instagram/Facebook).'});
          return;
        }
        if (typeof MediaRecorder === 'undefined') {
          setMicError({title:'Recorder not supported', body:'Your browser doesn\'t support MediaRecorder. Update iOS or use Safari/Chrome.'});
          return;
        }
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({audio:true});
        } catch(e) {
          const name = e && e.name || 'Error';
          const msg  = e && e.message || String(e);
          let title = 'Microphone blocked', body = msg;
          if (name === 'NotAllowedError' || name === 'SecurityError') {
            title = 'Microphone permission denied';
            body  = 'Open the "aA" menu in Safari → Website Settings → Microphone → Allow. Then reload this page.';
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            title = 'No microphone found';
            body  = 'No mic is available. Check that nothing else (call, voice memo, another tab) is using it.';
          } else if (name === 'NotReadableError') {
            title = 'Mic is busy';
            body  = 'Another app is holding the microphone. Close other tabs/apps using audio and try again.';
          } else if (name === 'AbortError') {
            title = 'Permission prompt aborted';
            body  = 'You may have switched away. Tap Record again.';
          }
          setMicError({title, body, raw: name + ': ' + msg});
          return;
        }
        try {
          const mime = pickRecMime();
          chunksRef.current = [];
          const mr = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
          const usedType = mr.mimeType || mime || 'audio/webm';
          // NB: MediaRecorder.stream is a read-only getter on Chrome — no assignment needed.
          mr.ondataavailable = e => { if (e.data.size>0) chunksRef.current.push(e.data); };
          mr.onstop = () => {
            const blob = new Blob(chunksRef.current, {type: usedType});
            const ext  = usedType.includes('mp4') ? 'm4a' : usedType.includes('ogg') ? 'ogg' : 'webm';
            setRecBlob(blob); setFile('mic-recording.' + ext);
            try { stream.getTracks().forEach(t=>t.stop()); } catch(_){}
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
          };
          mr.onerror = (ev) => {
            setMicError({title:'Recording error', body: (ev && ev.error && ev.error.message) || 'Unknown recorder error'});
            try { stream.getTracks().forEach(t=>t.stop()); } catch(_){}
            setRecording(false);
          };
          mr.start();
          mediaRef.current = mr;
          setRecording(true); setRecBlob(null);
          startRef.current = performance.now();
          const tick = () => { setRecTime((performance.now()-startRef.current)/1000); rafRef.current=requestAnimationFrame(tick); };
          rafRef.current = requestAnimationFrame(tick);
        } catch(e) {
          try { stream.getTracks().forEach(t=>t.stop()); } catch(_){}
          setMicError({title:'Could not start recorder', body: (e && e.message) || String(e)});
        }
      };

      const stopRec = () => {
        if (mediaRef.current) { try{ mediaRef.current.stop(); }catch(_){} mediaRef.current=null; }
        setRecording(false);
      };

      const handleFile = e => {
        const f = e.target.files[0];
        if (!f) return;
        cleanupPreview();
        setFile(f.name); setRecBlob(f);
        if (!name) setName(f.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ').slice(0,24));
      };

      const togglePreview = () => {
        if (!recBlob) return;
        if (previewing) { cleanupPreview(); return; }
        try {
          const url = URL.createObjectURL(recBlob);
          previewURL.current = url;
          const a = new Audio(url);
          a.playsInline = true;
          previewRef.current = a;
          a.onended = () => cleanupPreview();
          a.onerror = () => cleanupPreview();
          a.play().then(() => setPreviewing(true)).catch(() => cleanupPreview());
        } catch(_) { cleanupPreview(); }
      };

      const handleAddCategory = () => {
        const id = newCatName.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0, 20);
        const display = newCatName.trim().slice(0, 24);
        if (!id || !display) return;
        if (categories.find(c => c.id === id)) {
          setCategory(id); setNewCatOpen(false); setNewCatName(''); return;
        }
        onAddCategory({id, name: display});
        setCategory(id);
        setNewCatOpen(false);
        setNewCatName('');
      };

      // Guarded close: stops mic + preview, blocked during upload
      const safeClose = () => {
        if (uploading) return;
        cleanupMic();
        cleanupPreview();
        onClose();
      };

      const handleSubmit = async () => {
        if (!name.trim() || uploading) return;
        cleanupPreview();
        if (recording) { try{ mediaRef.current && mediaRef.current.stop(); }catch(_){} setRecording(false); }
        setUploading(true);
        if (isEdit) {
          await onUpdate(editing.id, {name:name.trim(), emoji, color, category});
        } else {
          await onAdd({name:name.trim(), emoji, color, category, blob:recBlob});
        }
        onClose();
      };

      if (!open) return null;

      return (
        <div onClick={safeClose} style={{
          position:'fixed',inset:0,zIndex:200,
          background:'rgba(40,30,60,0.55)',
          display:'flex',alignItems:'flex-end',
          animation:'fadeIn .2s ease',
        }}>
          <div onClick={e=>e.stopPropagation()} style={{

    // ─── ShareDialog ────────────────────────────────────────────────────────────
    function ShareDialog({sound, onClose, onToast}) {
      const inputRef = React.useRef(null);
      const [copied, setCopied] = React.useState(false);
      if (!sound) return null;
      const url = `${window.location.origin}${window.location.pathname}?s=${encodeURIComponent(sound.id)}`;

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(url);
          setCopied(true);
          onToast && onToast('🔗 Link copied!');
          setTimeout(() => setCopied(false), 1800);
          return;
        } catch(_) {}
        // Fallback for older browsers / non-secure contexts
        try {
          const el = inputRef.current;
          if (el) {
            el.focus(); el.select(); el.setSelectionRange(0, url.length);
            document.execCommand && document.execCommand('copy');
            setCopied(true);
            onToast && onToast('🔗 Link copied!');
            setTimeout(() => setCopied(false), 1800);
          }
        } catch(_){}
      };

      const nativeShare = async () => {
        const data = {title:`Sojo Club: ${sound.name}`, text:`${sound.emoji||'🔊'} Listen to "${sound.name}"`, url};
        try {
          if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
            await navigator.share(data);
          }
        } catch(e) {
          if (e && e.name !== 'AbortError') onToast && onToast('Share cancelled');
        }
      };

      const hasNativeShare = typeof navigator !== 'undefined' && !!navigator.share;

      return (
        <div onClick={onClose} style={{
          position:'fixed', inset:0, zIndex:950,
          background:'rgba(40,30,60,0.6)',
          display:'flex', alignItems:'center', justifyContent:'center',
          padding:'env(safe-area-inset-top) 16px env(safe-area-inset-bottom)',
          animation:'fadeIn .2s ease',
        }}>
          <div onClick={e=>e.stopPropagation()} style={{
            width:'100%', maxWidth:420,
            background:'#FFF1E6',
            border:'3px solid #2A1F3D',
            borderRadius:24,
            padding:'22px 22px 20px',
            boxShadow:'8px 8px 0 #2A1F3D',
            animation:'popIn .25s cubic-bezier(.2,.9,.3,1.2)',
            position:'relative',
          }}>
            <button onClick={onClose} aria-label="Close" style={{
              position:'absolute', top:12, right:12,
              width:34, height:34, borderRadius:10,
              background:'#FFF1E6', border:'2.5px solid #2A1F3D',
              boxShadow:'2px 2px 0 #2A1F3D',
              fontSize:18, fontWeight:900, color:'#2A1F3D',
              cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
              padding:0, lineHeight:1,
            }}>×</button>

            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6,paddingRight:40}}>
              <div style={{fontSize:38, lineHeight:1}}>{sound.emoji || '🔗'}</div>
              <div style={{minWidth:0, flex:1}}>
                <div style={{fontSize:11,fontWeight:900,letterSpacing:1.2,color:'#2A1F3D',opacity:0.5,textTransform:'uppercase'}}>Share sound</div>
                <div style={{fontSize:18,fontWeight:900,color:'#2A1F3D',letterSpacing:-0.4,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{sound.name}</div>
              </div>
            </div>

            <p style={{fontSize:13,color:'#2A1F3D',opacity:0.7,marginTop:6,marginBottom:14,lineHeight:1.4}}>
              Anyone with the link can play this sound directly.
            </p>

            <div style={{display:'flex',gap:8,marginBottom:12}}>
              <input
                ref={inputRef}
                value={url}
                readOnly
                onFocus={e=>e.target.select()}
                style={{
                  flex:1, minWidth:0,
                  padding:'12px 14px',
                  fontSize:14, fontWeight:700,
                  fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace',
                  background:'rgba(42,31,61,0.05)', color:'#2A1F3D',
                  border:'2.5px solid #2A1F3D', outline:'none',
                  borderRadius:12,
                }}
              />
              <button onClick={copy} style={{
                padding:'0 18px',
                background: copied ? 'oklch(0.72 0.22 145)' : '#2A1F3D',
                color: copied ? '#2A1F3D' : '#FFF1E6',
                border:'2.5px solid #2A1F3D', borderRadius:12,
                fontSize:13, fontWeight:900, letterSpacing:0.3,
                cursor:'pointer', whiteSpace:'nowrap',
                boxShadow:'3px 3px 0 oklch(0.72 0.22 30)',
                display:'flex', alignItems:'center', gap:6,
              }}>
                {copied ? '✓ Copied' : '📋 Copy'}
              </button>
            </div>

            {hasNativeShare && (
              <button onClick={nativeShare} style={{
                width:'100%', padding:'12px 14px',
                background:'#FFF1E6', color:'#2A1F3D',
                border:'2.5px dashed #2A1F3D', borderRadius:12,
                fontSize:13, fontWeight:900, letterSpacing:0.3,
                cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A1F3D" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                  <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
                </svg>
                Share via…
              </button>
            )}
          </div>
        </div>
      );
    }

    // ─── SharedSoundOverlay ─────────────────────────────────────────────────────
    function SharedSoundOverlay({sound, loading, notFound, padColor, padColorDeep, isPlaying, isLoading, progress, onPlay, onStop, onShare, onClose}) {
      const base = sound ? padColor(sound.color, 0.82, 0.18) : 'rgba(42,31,61,0.06)';
      const deep = sound ? padColorDeep(sound.color, 0.48, 0.15) : 'rgba(42,31,61,0.2)';
      return (
        <div style={{
          position:'fixed', inset:0, zIndex:900,
          background:'#FFF1E6',
          backgroundImage:'radial-gradient(#2A1F3D 1.2px, transparent 1.2px)',
          backgroundSize:'20px 20px',
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          padding:'env(safe-area-inset-top) 24px env(safe-area-inset-bottom)',
          animation:'fadeIn .25s ease',
        }}>
          <div style={{
            display:'inline-block',padding:'4px 10px',borderRadius:8,
            background:'oklch(0.8 0.2 60)',color:'#2A1F3D',
            fontSize:11,fontWeight:900,letterSpacing:1.5,textTransform:'uppercase',
            border:'2px solid #2A1F3D',transform:'rotate(-2deg)',
            boxShadow:'3px 3px 0 #2A1F3D', marginBottom:32,
          }}>Sojo Club · shared sound</div>

          {loading ? (
            <>
              <div style={{fontSize:64, marginBottom:18}}>⏳</div>
              <div style={{fontSize:18, fontWeight:900, color:'#2A1F3D', opacity:0.6}}>Loading…</div>
            </>
          ) : notFound ? (
            <>
              <div style={{fontSize:64, marginBottom:18}}>🫥</div>
              <h2 style={{fontSize:22, fontWeight:900, color:'#2A1F3D', marginBottom:8, textAlign:'center'}}>Sound not found</h2>
              <p style={{fontSize:14, color:'#2A1F3D', opacity:0.6, textAlign:'center', maxWidth:300, marginBottom:28}}>
                It may have been deleted, or the link is mistyped.
              </p>
              <button onClick={onClose} style={{
                padding:'14px 26px', borderRadius:16,
                background:'#2A1F3D', color:'#FFF1E6',
                border:'3px solid #2A1F3D', cursor:'pointer',
                fontSize:15, fontWeight:900, letterSpacing:0.3,
                boxShadow:'4px 4px 0 oklch(0.72 0.22 30)',
              }}>Open the soundboard</button>
            </>
          ) : sound ? (
            <>
              <div onClick={isPlaying ? onStop : onPlay} style={{
                width:'min(72vw, 280px)', aspectRatio:'1/1', borderRadius:32,
                background: base, border:'4px solid #2A1F3D',
                boxShadow:`8px 8px 0 #2A1F3D, inset 0 -10px 0 ${deep}88`,
                display:'flex', alignItems:'center', justifyContent:'center',
                cursor:'pointer', userSelect:'none', position:'relative',
                transform: isPlaying ? 'translate(0,-2px)' : 'translate(0,0)',
                animation: isPlaying ? 'clayWobble 0.5s ease-in-out infinite' : 'none',
                transition:'transform .15s',
              }}>
                <div style={{
                  fontSize:'min(28vw, 110px)', lineHeight:1,
                  filter:'drop-shadow(3px 3px 0 rgba(42,31,61,0.2))',
                }}>{isLoading ? '⏳' : sound.emoji || '🔊'}</div>
                {isPlaying && (
                  <div style={{position:'absolute',left:8,right:8,bottom:8,height:6,borderRadius:3,overflow:'hidden',background:'rgba(42,31,61,0.25)'}}>
                    <div style={{height:'100%',width:`${progress*100}%`,background:'#2A1F3D',transition:'width .05s linear'}} />
                  </div>
                )}
              </div>

              <h2 style={{
                marginTop:28, fontSize:'clamp(22px,6vw,30px)', fontWeight:900,
                color:'#2A1F3D', letterSpacing:-0.8, textAlign:'center',
                maxWidth:'90vw', wordBreak:'break-word',
              }}>{sound.name.toUpperCase()}</h2>

              <button onClick={isPlaying ? onStop : onPlay} disabled={isLoading} style={{
                marginTop:24, padding:'16px 32px', borderRadius:18,
                background: isPlaying ? 'oklch(0.72 0.22 30)' : '#2A1F3D',
                color: isPlaying ? '#2A1F3D' : '#FFF1E6',
                border:'3px solid #2A1F3D', cursor:'pointer',
                fontSize:16, fontWeight:900, letterSpacing:0.3,
                boxShadow:'5px 5px 0 oklch(0.72 0.22 30)',
                display:'flex', alignItems:'center', gap:10,
                opacity: isLoading ? 0.6 : 1,
              }}>
                {isLoading ? '⏳ Loading…' : isPlaying ? '⏸ Stop' : '▶ Play sound'}
              </button>

              <div style={{display:'flex', gap:10, marginTop:18, flexWrap:'wrap', justifyContent:'center'}}>
                <button onClick={onShare} style={{
                  padding:'10px 18px', borderRadius:14,
                  background:'#FFF1E6', color:'#2A1F3D',
                  border:'2.5px solid #2A1F3D', cursor:'pointer',
                  fontSize:13, fontWeight:900, letterSpacing:0.3,
                  boxShadow:'3px 3px 0 #2A1F3D',
                }}>🔗 Share</button>
                <button onClick={onClose} style={{
                  padding:'10px 18px', borderRadius:14,
                  background:'transparent', color:'#2A1F3D',
                  border:'2.5px dashed #2A1F3D', cursor:'pointer',
                  fontSize:13, fontWeight:900, letterSpacing:0.3,
                }}>Open the full board →</button>
              </div>
            </>
          ) : (
            <>
              <div style={{fontSize:64, marginBottom:18}}>⏳</div>
              <div style={{fontSize:18, fontWeight:900, color:'#2A1F3D', opacity:0.6}}>Loading…</div>
            </>
          )}
        </div>
      );
    }

    // ─── App ────────────────────────────────────────────────────────────────────
    function App() {
      const sb = useSoundboard();
      const {
        sounds, filtered, playingId, loadingId, progress,
        loop, setLoop, category, setCategory,
        addOpen, setAddOpen, play, stop, toggleFav, addSound, deleteSound,
        appLoading, syncDot, refresh, refreshing,
        editMode, setEditMode,
        allCategories, addCategory, updateSoundCategory,
        editingSound, setEditingSound, updateSound,
      } = sb;
      const activeSound = sounds.find(s => s.id === playingId);

      // ─── Share / permalink ──────────────────────────────────────────────────
      const sharedId = React.useMemo(() => {
        try { return new URL(window.location.href).searchParams.get('s') || null; }
        catch(_) { return null; }
      }, []);
      const [sharedDismissed, setSharedDismissed] = React.useState(false);
      const sharedSound = (sharedId && !sharedDismissed) ? sounds.find(s => s.id === sharedId) : null;
      const sharedNotFound = !!(sharedId && !sharedDismissed && !appLoading && !sharedSound);

      const dismissShared = React.useCallback(() => {
        setSharedDismissed(true);
        try {
          const u = new URL(window.location.href);
          u.searchParams.delete('s');
          window.history.replaceState(null, '', u.pathname + (u.search || '') + (u.hash || ''));
        } catch(_){}
      }, []);

      const [toast, setToast] = React.useState(null);
      const showToast = React.useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(t => t === msg ? null : t), 2200);
      }, []);

      // Share dialog: sound being shared (or null = closed)
      const [shareDialogSound, setShareDialogSound] = React.useState(null);
      const shareSound = React.useCallback((id) => {
        const s = sounds.find(x => x.id === id);
        if (s) setShareDialogSound(s);
      }, [sounds]);

      // Visible diagnostic toast for audio errors (so we can debug iOS without devtools)
      const [audioErr, setAudioErr] = React.useState(null);
      React.useEffect(() => {
        const onErr = (e) => { setAudioErr(e.detail); setTimeout(() => setAudioErr(null), 8000); };
        window.addEventListener('audio-error', onErr);
        return () => window.removeEventListener('audio-error', onErr);
      }, []);

      if (appLoading) return (
        <div style={{
          height:'100%', display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          background:'#FFF1E6', gap:16,
        }}>
          <div style={{fontSize:52}}>🎉</div>
          <div style={{
            fontSize:22, fontWeight:900, color:'#2A1F3D',
            letterSpacing:-1,
          }}>Loading board…</div>
          <div style={{
            width:40,height:40,borderRadius:'50%',
            border:'4px solid #2A1F3D',borderTopColor:'transparent',
            animation:'spin 0.7s linear infinite',
          }} />
        </div>
      );

      return (
        <div style={{
          width:'100%', height:'100%',
          background:'#FFF1E6', color:'#2A1F3D',
          fontFamily:'"Nunito",system-ui,sans-serif',
          position:'relative', overflow:'hidden',
          display:'flex', flexDirection:'column',
          paddingTop:'env(safe-area-inset-top)',
        }}>
          {/* Dotted bg */}
          <div style={{
            position:'absolute',inset:0,pointerEvents:'none',
            backgroundImage:'radial-gradient(#2A1F3D 1.2px, transparent 1.2px)',
            backgroundSize:'20px 20px', opacity:0.08,
          }} />

          {/* Audio error toast */}
          {audioErr && (
            <div style={{
              position:'fixed', top:'env(safe-area-inset-top)', left:14, right:14, zIndex:1000,
              background:'oklch(0.62 0.22 25)', color:'#fff',
              padding:'12px 14px', borderRadius:14,
              border:'2.5px solid #2A1F3D', boxShadow:'4px 4px 0 #2A1F3D',
              fontSize:13, fontWeight:700, lineHeight:1.3,
              animation:'popIn .25s ease',
            }}>🔊 {audioErr}</div>
          )}

          {/* Real-time sync dot */}
          {syncDot && (
            <div style={{
              position:'absolute', top:14, right:14, zIndex:10,
              width:10, height:10, borderRadius:'50%',
              background:'oklch(0.72 0.22 145)',
              border:'2px solid #2A1F3D',
              boxShadow:'2px 2px 0 #2A1F3D',
              animation:'popIn .3s ease',
            }} title="New sound synced!" />
          )}

          {/* Header */}
          <div style={{padding:'clamp(14px,5vw,20px) clamp(14px,5vw,20px) 0',position:'relative',zIndex:2}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
              <div style={{minWidth:0, flex:1}}>
                <div style={{
                  display:'inline-block',padding:'4px 10px',borderRadius:20,
                  background:'oklch(0.72 0.22 30 / 0.14)',color:'oklch(0.5 0.19 30)',
                  fontSize:11,fontWeight:700,letterSpacing:0.8,
                }}>Sojo Club</div>
                <h1 style={{
                  margin:'10px 0 0',
                  fontSize:'clamp(24px,7.5vw,36px)',
                  fontWeight:900,letterSpacing:-1.5,lineHeight:0.95,color:'#2A1F3D',
                }}>SOUNDBOARD<br />
                  <span style={{fontSize:'clamp(13px,4vw,16px)',fontWeight:700,letterSpacing:0,color:'oklch(0.55 0.2 340)'}}>
                    tap to play · hold ⋯ for options
                  </span>
                </h1>
              </div>
              <div style={{display:'flex', gap:10, alignItems:'flex-start', flexShrink:0}}>
                <button
                  onClick={refresh}
                  disabled={refreshing}
                  aria-label="Refresh"
                  title="Refresh"
                  style={{
                    width:48,height:48,borderRadius:16,
                    background:'oklch(0.6 0.16 300 / 0.14)', color:'oklch(0.5 0.16 300)',
                    border:'none', cursor: refreshing ? 'wait' : 'pointer',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    padding:0,
                  }}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                       style={{animation: refreshing ? 'spin 0.7s linear infinite' : 'none'}}>
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                  </svg>
                </button>
                <button
                  onClick={()=>setEditMode(m=>!m)}
                  aria-label={editMode ? 'Done editing' : 'Edit board'}
                  title={editMode ? 'Done' : 'Edit'}
                  style={{
                    width:48,height:48,borderRadius:16,
                    background: editMode ? 'oklch(0.72 0.22 30)' : 'oklch(0.72 0.22 30 / 0.14)',
                    color: editMode ? '#FFF1E6' : 'oklch(0.5 0.19 30)',
                    border:'none', cursor:'pointer', padding:0,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontSize: editMode ? 13 : 0, fontWeight:700,
                  }}>
                  {editMode ? 'Done' : (
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                  )}
                </button>
                <button onClick={()=>setAddOpen(true)} aria-label="Add sound" style={{
                  width:48,height:48,borderRadius:16,
                  background:'oklch(0.72 0.22 30)',color:'#FFF1E6',
                  border:'none',cursor:'pointer',
                  fontSize:26,fontWeight:700,lineHeight:1,
                  display:'flex',alignItems:'center',justifyContent:'center',
                }}>+</button>
              </div>
            </div>
          </div>

          {/* Category chips */}
          <div style={{
            display:'flex',gap:8,
            padding:'clamp(12px,4vw,20px) clamp(14px,5vw,20px) 10px',
            overflowX:'auto',position:'relative',zIndex:2,
          }}>
            {allCategories.map((c,i) => (
              <button key={c.id} onClick={()=>setCategory(c.id)} style={{
                padding:'7px 14px',borderRadius:20,cursor:'pointer',
                fontSize:13,fontWeight:600,fontFamily:'inherit',
                background: category===c.id ? '#2A1F3D' : 'transparent',
                color:      category===c.id ? '#FFF1E6' : '#9C8FAE',
                border: category===c.id ? 'none' : '1px solid #E6D9C9',
                whiteSpace:'nowrap',flexShrink:0,transition:'all .15s',
              }}>{c.name}</button>
            ))}
          </div>

          {/* Pad grid */}
          <div style={{
            flex:1,
            padding:`8px clamp(14px,5vw,20px) ${activeSound?170:90}px`,
            overflowY:'auto',position:'relative',zIndex:2,
          }}>
            {filtered.length === 0 ? (
              <div style={{textAlign:'center',padding:'40px 20px',fontSize:15,fontWeight:700,color:'#2A1F3D',opacity:0.4}}>
                No sounds here yet.<br />Tap + to add one!
              </div>
            ) : (
              <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                {filtered.map(s => (
                  <SoundRow key={s.id} sound={s}
                    active={playingId===s.id}
                    loading={loadingId===s.id}
                    progress={playingId===s.id ? progress : 0}
                    editMode={editMode}
                    categories={allCategories}
                    onTap={()=>play(s.id)}
                    onToggleFav={()=>toggleFav(s.id)}
                    onDelete={()=>deleteSound(s.id)}
                    onMove={(catId)=>updateSoundCategory(s.id, catId)}
                    onShare={()=>shareSound(s.id)}
                    onEdit={()=>setEditingSound(s)}
                  />
                ))}
              </div>
            )}
          </div>

          {/* Bottom player */}
          <div style={{
            position:'absolute',
            left:'clamp(8px,3vw,12px)', right:'clamp(8px,3vw,12px)',
            bottom:'max(24px,calc(env(safe-area-inset-bottom) + 12px))',
            zIndex:3,
            background:'#2A1F3D',color:'#FFF1E6',
            border:'none',
            borderRadius:20,padding:'14px 16px',
            display:'flex',alignItems:'center',gap:12,
            boxShadow:'0 6px 20px rgba(42,31,61,0.25)',
          }}>
            <div style={{
              width:44,height:44,borderRadius:12,flexShrink:0,
              background: activeSound ? padColor(activeSound.color) : 'rgba(255,241,230,0.15)',
              border:'2.5px solid #FFF1E6',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,
              transform: activeSound ? `rotate(${Math.sin(progress*20)*8}deg)` : 'rotate(0)',
              transition:'background .3s',
            }}>{activeSound ? activeSound.emoji : '🎉'}</div>

            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:900,letterSpacing:-0.3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                {activeSound ? activeSound.name.toUpperCase() : 'READY TO PARTY!'}
              </div>
              <div style={{height:8,marginTop:6,borderRadius:4,background:'rgba(255,241,230,0.15)',overflow:'hidden',border:'1.5px solid #FFF1E6'}}>
                <div style={{height:'100%',width:`${progress*100}%`,background:activeSound?padColor(activeSound.color):'#FFF1E6',transition:'width .05s linear',borderRadius:4}} />
              </div>
            </div>

            {/* Share */}
            <button
              onClick={()=>activeSound&&shareSound(activeSound.id)}
              disabled={!activeSound}
              aria-label="Share sound"
              title={activeSound ? 'Share this sound' : 'Tap a sound first'}
              style={{
                width:38,height:38,borderRadius:10,flexShrink:0,
                background: activeSound ? 'oklch(0.85 0.15 220)' : 'rgba(255,241,230,0.1)',
                color: activeSound ? '#2A1F3D' : '#FFF1E6',
                border:'2px solid rgba(255,241,230,0.4)',
                cursor: activeSound ? 'pointer' : 'default',
                opacity: activeSound ? 1 : 0.5,
                display:'flex',alignItems:'center',justifyContent:'center',
                transition:'all .2s', padding:0,
              }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
            </button>

            {/* Loop */}
            <button onClick={()=>setLoop(l=>!l)} style={{
              width:38,height:38,borderRadius:10,flexShrink:0,
              background: loop ? 'oklch(0.8 0.2 60)' : 'rgba(255,241,230,0.1)',
              color:'#FFF1E6', border:'2px solid rgba(255,241,230,0.4)',
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
              transition:'background .2s',
            }} title={loop ? 'Loop on' : 'Loop off'}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
            </button>

            {/* Stop */}
            <button onClick={()=>playingId&&stop()} style={{
              width:46,height:46,borderRadius:'50%',flexShrink:0,
              background:'oklch(0.72 0.22 30)',color:'#2A1F3D',
              border:'2.5px solid rgba(255,241,230,0.5)',
              cursor:playingId?'pointer':'default',
              display:'flex',alignItems:'center',justifyContent:'center',
              opacity:playingId?1:0.5,transition:'opacity .2s',
            }}>
              {playingId
                ? <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                : <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>}
            </button>
          </div>

          {/* Toast (e.g. "Link copied!") */}
          {toast && (
            <div style={{
              position:'fixed', left:'50%', bottom:'calc(env(safe-area-inset-bottom) + 110px)',
              transform:'translateX(-50%)', zIndex:1100,
              padding:'10px 18px', borderRadius:14,
              background:'#2A1F3D', color:'#FFF1E6',
              fontSize:13, fontWeight:900, letterSpacing:0.3,
              border:'2.5px solid #FFF1E6', boxShadow:'4px 4px 0 oklch(0.72 0.22 30)',
              animation:'popIn .25s ease',
              maxWidth:'90vw', textAlign:'center',
            }}>{toast}</div>
          )}

          {/* Shared-link landing overlay */}
          {sharedId && !sharedDismissed && (
            <SharedSoundOverlay
              sound={sharedSound}
              loading={appLoading}
              notFound={sharedNotFound}
              padColor={padColor}
              padColorDeep={padColorDeep}
              isPlaying={playingId === sharedId}
              isLoading={loadingId === sharedId}
              progress={playingId === sharedId ? progress : 0}
              onPlay={() => sharedSound && play(sharedSound.id)}
              onStop={stop}
              onShare={() => sharedSound && shareSound(sharedSound.id)}
              onClose={dismissShared}
            />
          )}

          <ShareDialog
            sound={shareDialogSound}
            onClose={()=>setShareDialogSound(null)}
            onToast={showToast}
          />

          <AddSoundModal
            open={addOpen || !!editingSound}
            onClose={()=>{ setAddOpen(false); setEditingSound(null); }}
            onAdd={addSound}
            onUpdate={updateSound}
            editing={editingSound}
            categories={allCategories}
            onAddCategory={addCategory}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
